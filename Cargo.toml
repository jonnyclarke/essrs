[package]
name = "essrs"
version = "0.1.0"
edition = "2024"

[lib]
name = "essrs"
path = "src/lib.rs"

[dependencies]
nalgebra = "0.34.1"
ndarray = "0.17.1"
ndarray-linalg = "0.18.0"
num-traits = "0.2.19"
rand = "0.9.2"
rand_distr = "0.5.1"
rustfft = "6.4.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "time"] }

[dev-dependencies]
criterion = "0.7.0"
ndarray = "0.17.1"
ndarray-stats = "0.6.0"
rand = "0.9.2"
rand_distr = "0.5.1"

[workspace.metadata.clippy]
wildcard_imports = "forbid"

[[bench]]
name = "bench_gaussian_1d_fit"
harness = false
