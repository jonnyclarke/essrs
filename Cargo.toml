[package]
name = "essrs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "essrs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
katexit = { version = "0.1.5", package = "katexit", optional = true }
nalgebra = "0.34.1"
ndarray = "0.16.1"
num-traits = "0.2.19"
numpy = { version = "0.26", optional = true }
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.12.0"
thiserror = "2.0.21"
tracing = "0.1.43"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.7.0"
ndarray = { version = "0.16.1", features = ["approx"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rstest = "0.26.1"
rstest_macros = "0.26.1"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.22", features = ["time"] }

[workspace.metadata.clippy]
wildcard_imports = "forbid"

[[bench]]
name = "bench_gaussian_1d_fit"
harness = false

# [[bench]]
# name = "bench_move_handler"
# harness = false

[features]
doc-math = ["dep:katexit"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies.pyo3]
version = "0.26"
optional = true
features = ["extension-module"]
